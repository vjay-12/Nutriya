<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6F5E" />
      <stop offset="100%" stop-color="#1B4338" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8CE07A" />
      <stop offset="100%" stop-color="#E5A93B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Rounded Card (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Radiating Sun / Bone-matrix Rays -->
  <g stroke="#8CE07A" stroke-width="8" stroke-linecap="round" opacity="0.45">
    <line x1="256" y1="90" x2="256" y2="114" />
    <line x1="256" y1="398" x2="256" y2="422" />
    <line x1="90" y1="256" x2="114" y2="256" />
    <line x1="398" y1="256" x2="422" y2="256" />
    <line x1="138" y1="138" x2="155" y2="155" />
    <line x1="357" y1="357" x2="374" y2="374" />
    <line x1="138" y1="374" x2="155" y2="357" />
    <line x1="357" y1="155" x2="374" y2="138" />
  </g>

  <!-- Golden Sun Core -->
  <circle cx="256" cy="256" r="82" fill="#E5A93B" opacity="0.25" />

  <!-- Botanical Leaf & Bone Health Emblem -->
  <path d="M 256 140 
           C 340 140 370 210 370 280 
           C 370 340 320 372 256 372 
           C 192 372 142 340 142 280 
           C 142 210 172 140 256 140 Z" 
        fill="url(#leafGrad)" />

  <!-- Inner Leaf Spine / Sun Vein -->
  <path d="M 256 170 Q 256 260 256 348" 
        stroke="#234B3E" stroke-width="10" stroke-linecap="round" />
  
  <path d="M 256 240 Q 295 220 315 225" 
        stroke="#234B3E" stroke-width="7" stroke-linecap="round" />
        
  <path d="M 256 275 Q 215 255 195 260" 
        stroke="#234B3E" stroke-width="7" stroke-linecap="round" />
</svg>
